name: Build and Release TQ-Printer Firmware

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.x'

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Syntax check (compile without output)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            Thermal-Printer

      - name: Compile firmware (release build)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --output-dir build \
            Thermal-Printer

      - name: Rename firmware binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mv build/Thermal-Printer.ino.bin \
            "build/TQ-Printer_${{ github.ref_name }}.bin"

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: build/TQ-Printer_${{ github.ref_name }}.bin
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/TQ-Printer_${{ github.ref_name }}.bin
          body: |
            Compiled firmware binary for **${{ github.ref_name }}**.

            Flash via `/ota` in the Web-UI or with `python flash.py --port COMx`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
